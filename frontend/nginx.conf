# Other host names are dropped (DNS rebinding).
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" always;

    error_page 502 503 504 /errors/unavailable.json;
    location ^~ /errors/ {
        internal;
        default_type application/json;
        location = /errors/unavailable.json { return 503 '{"detail":"The API is not responding yet; it may still be loading the library"}'; }
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # An answer with adaptive thinking can take a while; the SDK times out at 120 s first.
        proxy_read_timeout 150s;
    }

    location / {
        try_files $uri /index.html;
    }
}
